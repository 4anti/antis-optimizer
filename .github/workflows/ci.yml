name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 22]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run zero-dependency lexer suite
        env:
          ANTIS_FORCE_LEXER: "1"
        run: npm test

      - name: Run TypeScript Compiler AST suite
        run: |
          npm install --no-save --no-package-lock typescript
          npm test
