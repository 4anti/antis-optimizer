name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20, 22, 24]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run zero-dependency lexer suite
        env:
          ANTIS_FORCE_LEXER: "1"
        run: npm test

      - name: Dogfood self-verify
        run: node scripts/repo-index.cjs --verify

      - name: Run TypeScript Compiler AST suite
        env:
          ANTIS_EXPECT_AST: "1"
        run: |
          npm install --no-save --no-package-lock typescript@5
          npm test

      - name: Lexer accuracy corpus (must not drop below baseline)
        run: node test/accuracy.cjs --require-all
