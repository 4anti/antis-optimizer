name: Release

# Push a tag like v1.3.0 (matching package.json) to test, create the GitHub Release
# from CHANGELOG.md, and publish to npm via trusted publishing (OIDC, no token secret).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tag must match package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $PKG"
            exit 1
          fi

      - name: Test (lexer) and self-verify
        env:
          ANTIS_FORCE_LEXER: "1"
        run: |
          npm test
          node scripts/repo-index.cjs --verify

      - name: Extract release notes from CHANGELOG.md
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v h="## [$VER]" 'index($0, h) == 1 {f=1; next} index($0, "## [") == 1 {f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [$VER]"
            exit 1
          fi

      - name: Create GitHub Release (skipped if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md

      - name: Publish to npm (skipped if this version is already published)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if npm view "antis-optimizer@$VER" version >/dev/null 2>&1; then
            echo "antis-optimizer@$VER already on npm; skipping"
            exit 0
          fi
          npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
          npm publish --access public --provenance
