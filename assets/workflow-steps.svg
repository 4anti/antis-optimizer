<svg xmlns="http://www.w3.org/2000/svg" width="984" height="222" viewBox="-12 -10 984 222" role="img" aria-label="4-step workflow diagram">
  <rect x="-11" y="-9" width="982" height="220" rx="14" fill="#0d1110" stroke="#222b27" stroke-width="1"/>
        <g fill="none" stroke-width="1.6">
          <line x1="224" y1="100" x2="248" y2="100" stroke="#27312c"/>
          <line x1="466" y1="100" x2="490" y2="100" stroke="#27312c"/>
          <line x1="708" y1="100" x2="732" y2="100" stroke="#27312c"/>
          <line x1="224" y1="100" x2="248" y2="100" stroke="#34d399" stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="1s" repeatCount="indefinite"/></line>
          <line x1="466" y1="100" x2="490" y2="100" stroke="#34d399" stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="1s" repeatCount="indefinite"/></line>
          <line x1="708" y1="100" x2="732" y2="100" stroke="#34d399" stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="1s" repeatCount="indefinite"/></line>
        </g>

        <rect x="4" y="8" width="220" height="186" rx="12" fill="#101412" stroke="#27312c">
          <animate attributeName="stroke" values="#27312c;#10b981;#27312c;#27312c" keyTimes="0;0.14;0.30;1" dur="8s" repeatCount="indefinite"/>
        </rect>
        <text x="20" y="32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#34d399">01</text>
        <text x="42" y="32" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f1f5f3">Find Bloat</text>
        <text x="20" y="54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#34d399">$ --audit</text>
        <rect x="20" y="66" width="188" height="72" rx="7" fill="#0b0e0d" stroke="#1d2521"/>
        <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.8">
          <text x="30" y="86" fill="#f59e0b">worktrees/   119.9 MB</text>
          <text x="30" y="104" fill="#b2beb8">dist/         18.6 MB</text>
          <text x="30" y="124" fill="#34d399">active      166/1,548</text>
        </g>
        <text x="20" y="166" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif" font-size="11" fill="#b2beb8">Spots junk and &gt;15 KB files</text>

        <rect x="248" y="8" width="218" height="186" rx="12" fill="#101412" stroke="#27312c">
          <animate attributeName="stroke" values="#27312c;#27312c;#10b981;#27312c;#27312c" keyTimes="0;0.24;0.39;0.55;1" dur="8s" repeatCount="indefinite"/>
        </rect>
        <text x="264" y="32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#34d399">02</text>
        <text x="286" y="32" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f1f5f3">Sync Ignores</text>
        <text x="264" y="54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#34d399">$ --sync-ignores</text>
        <rect x="264" y="66" width="186" height="72" rx="7" fill="#0b0e0d" stroke="#1d2521"/>
        <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.8">
          <text x="274" y="86" fill="#34d399">✓ <tspan fill="#f1f5f3">.ignore</tspan></text>
          <text x="274" y="104" fill="#34d399">✓ <tspan fill="#f1f5f3">.contextignore</tspan></text>
          <text x="274" y="122" fill="#34d399">✓ <tspan fill="#f1f5f3">.jcodemunch.jsonc</tspan></text>
        </g>
        <text x="264" y="166" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif" font-size="11" fill="#b2beb8">Mirrors rules across tools</text>

        <rect x="490" y="8" width="218" height="186" rx="12" fill="#101412" stroke="#27312c">
          <animate attributeName="stroke" values="#27312c;#27312c;#10b981;#27312c;#27312c" keyTimes="0;0.48;0.64;0.80;1" dur="8s" repeatCount="indefinite"/>
        </rect>
        <text x="506" y="32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#34d399">03</text>
        <text x="528" y="32" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f1f5f3">Slice Lines</text>
        <text x="506" y="54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#34d399">$ --outline / --slice</text>
        <rect x="506" y="66" width="186" height="72" rx="7" fill="#0b0e0d" stroke="#1d2521"/>
        <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.8">
          <text x="516" y="86" fill="#34d399">L18-L54  <tspan fill="#f1f5f3">verifyToken</tspan></text>
          <text x="516" y="104" fill="#7d8a83">L56-L102 <tspan fill="#b2beb8">refreshUser</tspan></text>
          <text x="516" y="122" fill="#7d8a83">L104-138 <tspan fill="#b2beb8">revokeToken</tspan></text>
        </g>
        <text x="506" y="166" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif" font-size="11" fill="#b2beb8">Jumps straight to symbols</text>

        <rect x="732" y="8" width="224" height="186" rx="12" fill="#101412" stroke="#27312c">
          <animate attributeName="stroke" values="#27312c;#27312c;#10b981;#27312c" keyTimes="0;0.74;0.88;1" dur="8s" repeatCount="indefinite"/>
        </rect>
        <text x="748" y="32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#34d399">04</text>
        <text x="770" y="32" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#f1f5f3">Stay Verified</text>
        <text x="748" y="54" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#34d399">$ --verify</text>
        <rect x="748" y="66" width="192" height="72" rx="7" fill="#0b0e0d" stroke="#1d2521"/>
        <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.8">
          <text x="758" y="87" fill="#7d8a83">L18-L54 -&gt; <tspan fill="#34d399" font-weight="700">L24-L60</tspan></text>
          <rect x="758" y="98" width="172" height="5" rx="2.5" fill="#1e2622"/>
          <rect x="758" y="98" width="172" height="5" rx="2.5" fill="#34d399">
            <animate attributeName="width" values="24;172;172;24" keyTimes="0;0.38;0.88;1" dur="4s" repeatCount="indefinite"/>
          </rect>
          <text x="758" y="124" font-weight="700" fill="#34d399">PASS <tspan fill="#b2beb8" font-weight="400">(38 tokens)</tspan></text>
        </g>
        <text x="748" y="166" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif" font-size="11" fill="#b2beb8">Heals shifted line ranges</text>
      </svg>
