<svg xmlns="http://www.w3.org/2000/svg" width="880" height="216" viewBox="0 0 880 216" role="img" aria-label="How antis-optimizer works in 4 simple steps">
  <!-- Background -->
  <rect x="2" y="2" width="876" height="212" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <text x="26" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#f0f6fc">How It Works (4 Steps)</text>
  <text x="184" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">One fast scan → cleaner searches, synced ignores, exact line reads</text>

  <!-- Animated connector lines between cards -->
  <g stroke-width="2" fill="none">
    <line x1="210" y1="122" x2="236" y2="122" stroke="#30363d"/>
    <line x1="426" y1="122" x2="452" y2="122" stroke="#30363d"/>
    <line x1="642" y1="122" x2="668" y2="122" stroke="#30363d"/>

    <line x1="210" y1="122" x2="236" y2="122" stroke="#58a6ff" stroke-dasharray="4 6">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="426" y1="122" x2="452" y2="122" stroke="#58a6ff" stroke-dasharray="4 6">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="642" y1="122" x2="668" y2="122" stroke="#58a6ff" stroke-dasharray="4 6">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Traveling light dots across steps -->
  <circle cx="212" cy="122" r="3.5" fill="#79c0ff">
    <animate attributeName="cx" values="212;234" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="428" cy="122" r="3.5" fill="#79c0ff">
    <animate attributeName="cx" values="428;450" begin="0.4s" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" begin="0.4s" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="644" cy="122" r="3.5" fill="#56d364">
    <animate attributeName="cx" values="644;666" begin="0.8s" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" begin="0.8s" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Step 1 -->
  <rect x="20" y="52" width="190" height="142" rx="10" fill="#161b22" stroke="#30363d">
    <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d;#30363d" keyTimes="0;0.15;0.35;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="42" cy="76" r="11" fill="#1f6feb" fill-opacity="0.25" stroke="#58a6ff"/>
  <text x="42" y="80" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#79c0ff">1</text>
  <text x="62" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">Find Bloat</text>
  <rect x="32" y="96" width="166" height="22" rx="5" fill="#0d1117" stroke="#21262d"/>
  <text x="42" y="111" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#79c0ff">--audit</text>
  <text x="32" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#c9d1d9">Spots junk folders,</text>
  <text x="32" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#c9d1d9">huge bundles, and</text>
  <text x="32" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b949e">oversized source files.</text>

  <!-- Step 2 -->
  <rect x="236" y="52" width="190" height="142" rx="10" fill="#161b22" stroke="#30363d">
    <animate attributeName="stroke" values="#30363d;#30363d;#58a6ff;#30363d" keyTimes="0;0.25;0.42;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="258" cy="76" r="11" fill="#1f6feb" fill-opacity="0.25" stroke="#58a6ff"/>
  <text x="258" y="80" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#79c0ff">2</text>
  <text x="278" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">Block Everywhere</text>
  <rect x="248" y="96" width="166" height="22" rx="5" fill="#0d1117" stroke="#21262d"/>
  <text x="258" y="111" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#79c0ff">--sync-ignores</text>
  <text x="248" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#c9d1d9">Writes one ignore list</text>
  <text x="248" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#c9d1d9">shared across search,</text>
  <text x="248" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b949e">Claude, Cursor &amp; MCPs.</text>

  <!-- Step 3 -->
  <rect x="452" y="52" width="190" height="142" rx="10" fill="#161b22" stroke="#30363d">
    <animate attributeName="stroke" values="#30363d;#30363d;#58a6ff;#30363d" keyTimes="0;0.50;0.67;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="474" cy="76" r="11" fill="#1f6feb" fill-opacity="0.25" stroke="#58a6ff"/>
  <text x="474" y="80" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#79c0ff">3</text>
  <text x="494" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">Slice Exact Lines</text>
  <rect x="464" y="96" width="166" height="22" rx="5" fill="#0d1117" stroke="#21262d"/>
  <text x="474" y="111" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#79c0ff">--outline / --slice</text>
  <text x="464" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#c9d1d9">Maps functions &amp; tags</text>
  <text x="464" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#c9d1d9">to exact line ranges</text>
  <text x="464" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b949e">(no whole-file reads).</text>

  <!-- Step 4 -->
  <rect x="668" y="52" width="190" height="142" rx="10" fill="#161b22" stroke="#30363d">
    <animate attributeName="stroke" values="#30363d;#30363d;#3fb950;#30363d" keyTimes="0;0.75;0.90;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="690" cy="76" r="11" fill="#238636" fill-opacity="0.3" stroke="#3fb950"/>
  <text x="690" y="80" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#7ee787">4</text>
  <text x="710" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">Stay Verified</text>
  <rect x="680" y="96" width="166" height="22" rx="5" fill="#0d1117" stroke="#21262d"/>
  <text x="690" y="111" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#7ee787">--verify</text>
  <text x="680" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#c9d1d9">Updates shifted line</text>
  <text x="680" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#c9d1d9">numbers &amp; checks rules</text>
  <text x="680" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b949e">with a 1-line pass.</text>
</svg>
