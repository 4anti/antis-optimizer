          <text x="20" y="204" fill="#f1f5f3" font-weight="600">src/auth.ts</text>
          <text x="264" y="204" text-anchor="end" font-size="10" fill="#34d399">142 lines</text>
        </g>

        <g fill="none" stroke-width="1.6">
          <path d="M 280 38 C 328 38, 336 88, 378 88" stroke="#27312c"/>
          <path d="M 280 92 C 328 92, 336 101, 378 101" stroke="#27312c"/>
          <path d="M 280 146 C 328 146, 336 114, 378 114" stroke="#27312c"/>
          <path d="M 280 200 C 330 200, 338 132, 378 132" stroke="#34d399" stroke-opacity="0.82" stroke-dasharray="5 7">
            <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.1s" repeatCount="indefinite"/>
          </path>
          <path d="M 556 110 L 606 110" stroke="#34d399" stroke-width="2" stroke-dasharray="5 8">
            <animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.1s" repeatCount="indefinite"/>
          </path>
          <path d="M 467 180 L 467 218" stroke="#f59e0b" stroke-dasharray="4 5" stroke-opacity="0.78">
            <animate attributeName="stroke-dashoffset" from="18" to="0" dur="1s" repeatCount="indefinite"/>
          </path>
        </g>
        <polygon points="602,105 611,110 602,115" fill="#34d399"/>
        <polygon points="462,214 472,214 467,222" fill="#f59e0b"/>

        <rect x="378" y="46" width="178" height="134" rx="12" fill="#0b0e0d" stroke="#27312c"/>
        <text x="467" y="74" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="700" fill="#f1f5f3">antis-optimizer</text>
        <line x1="398" y1="87" x2="536" y2="87" stroke="#1d2521"/>
        <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" text-anchor="middle">
          <text x="467" y="108" fill="#b2beb8">1. sync ignores</text>
          <text x="467" y="129" fill="#34d399">2. AST outline/slice</text>
          <text x="467" y="150" fill="#b2beb8">3. verify lines</text>
          <text x="467" y="168" font-size="9.5" fill="#7d8a83">cap &lt;= 3.5 KB</text>
        </g>

        <rect x="378" y="222" width="178" height="46" rx="8" fill="#291b08" stroke="#d97706" stroke-opacity="0.55"/>
        <text x="467" y="242" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#f59e0b">-157.4 MB blocked</text>
        <text x="467" y="258" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#b2beb8">1,382 junk files skipped</text>

        <rect x="612" y="16" width="344" height="252" rx="12" fill="#0b0e0d" stroke="#10b981" stroke-opacity="0.55"/>
        <rect x="628" y="32" width="90" height="20" rx="5" fill="#0a291e" stroke="#10b981" stroke-opacity="0.5"/>
        <text x="673" y="45.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#34d399">EXACT SLICE</text>
        <text x="940" y="45.5" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7d8a83">1.4K tokens</text>

        <rect x="628" y="64" width="312" height="126" rx="8" fill="#151b18" stroke="#1d2521"/>
        <text x="640" y="84" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" font-weight="600" fill="#f1f5f3">src/auth.ts</text>
        <text x="926" y="84" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.8" fill="#34d399">L18-L54 (37L)</text>
        <line x1="628" y1="94" x2="940" y2="94" stroke="#1d2521"/>
        <rect x="631" y="101" width="2.5" height="78" rx="1.2" fill="#34d399"/>
        <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10">
          <text x="642" y="116" fill="#7d8a83">18  <tspan fill="#f1f5f3">async function verifyToken(jwt) {</tspan></text>
          <text x="642" y="134" fill="#7d8a83">19    <tspan fill="#b2beb8">const claims = await decode(jwt);</tspan></text>
          <text x="642" y="152" fill="#7d8a83">..    <tspan fill="#7d8a83">// only needed range injected</tspan></text>
          <text x="642" y="170" fill="#7d8a83">54  <tspan fill="#34d399">return claims; }</tspan></text>
        </g>

        <text x="628" y="214" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif" font-size="11" fill="#b2beb8">Context used</text>
        <text x="940" y="214" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" fill="#34d399">3% used, 91% saved</text>
        <rect x="628" y="224" width="312" height="10" rx="5" fill="#1e2622"/>
        <rect x="628" y="224" width="36" height="10" rx="5" fill="#34d399">
          <animate attributeName="width" values="72;28;28;72" keyTimes="0;0.35;0.85;1" dur="4.2s" repeatCount="indefinite"/>
        </rect>
        <text x="628" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.8" fill="#7d8a83">.ignore, .contextignore, .jcodemunch.jsonc synced</text>
      </svg>
