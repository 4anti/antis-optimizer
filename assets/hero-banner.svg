<svg xmlns="http://www.w3.org/2000/svg" width="984" height="308" viewBox="-12 -10 984 308" role="img" aria-label="antis-optimizer token funnel architecture">
  <rect x="-11" y="-9" width="982" height="306" rx="14" fill="#0d1110" stroke="#222b27" stroke-width="1"/>
        <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
          <rect x="4" y="16" width="276" height="44" rx="8" fill="#151b18" stroke="#27312c"/>
