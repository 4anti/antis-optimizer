<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="antis-optimizer before and after comparison">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f85149"/>
      <stop offset="100%" stop-color="#ff7b72"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ea043"/>
      <stop offset="100%" stop-color="#56d364"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="22%" cy="55%" r="36%">
      <stop offset="0%" stop-color="#f85149" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="78%" cy="55%" r="36%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer card -->
  <rect x="2" y="2" width="876" height="336" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="2" y="2" width="876" height="336" rx="16" fill="url(#glowLeft)"/>
  <rect x="2" y="2" width="876" height="336" rx="16" fill="url(#glowRight)"/>

  <!-- Top window bar -->
  <path d="M 18 2 H 862 A 16 16 0 0 1 878 18 V 48 H 2 V 18 A 16 16 0 0 1 18 2 Z" fill="#161b22"/>
  <line x1="2" y1="48" x2="878" y2="48" stroke="#21262d" stroke-width="1"/>
  <circle cx="24" cy="25" r="5.5" fill="#ff5f56"/>
  <circle cx="42" cy="25" r="5.5" fill="#ffbd2e"/>
  <circle cx="60" cy="25" r="5.5" fill="#27c93f"/>
  <text x="82" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f0f6fc">antis-optimizer</text>
  <text x="195" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">· Stop AI agents from wasting tokens on junk &amp; huge files</text>

  <!-- Live badge -->
  <rect x="742" y="13" width="116" height="24" rx="12" fill="#0f2a1d" stroke="#238636" stroke-width="1"/>
  <circle cx="758" cy="25" r="3.5" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.5;4.5;3.5" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="770" y="29" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" font-weight="600" fill="#7ee787">v1.0.0 · Ready</text>

  <!-- LEFT CARD: WITHOUT -->
  <rect x="24" y="68" width="310" height="206" rx="12" fill="#161b22" stroke="#f85149" stroke-opacity="0.45" stroke-width="1.2"/>
  <rect x="40" y="82" width="224" height="22" rx="6" fill="#321618"/>
  <text x="50" y="97" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" font-weight="700" fill="#ff7b72">WITHOUT · AI reads everything</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11.8">
    <text x="42" y="130" fill="#f85149" font-weight="700">×</text>
    <text x="58" y="130" fill="#c9d1d9">node_modules/</text>
    <text x="316" y="130" text-anchor="end" fill="#8b949e">120 MB</text>

    <text x="42" y="154" fill="#f85149" font-weight="700">×</text>
    <text x="58" y="154" fill="#c9d1d9">dist/ &amp; build/</text>
    <text x="316" y="154" text-anchor="end" fill="#8b949e">18.6 MB</text>

    <text x="42" y="178" fill="#f85149" font-weight="700">×</text>
    <text x="58" y="178" fill="#c9d1d9">assets/giant.json</text>
    <text x="316" y="178" text-anchor="end" fill="#8b949e">90 KB</text>

    <text x="42" y="202" fill="#d29922" font-weight="700">!</text>
    <text x="58" y="202" fill="#ffa657">Reads full 800-line file</text>
  </g>

  <text x="40" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">Context Window</text>
  <text x="316" y="229" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" font-weight="700" fill="#ff7b72">
    88% FULL · Wasted
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.2s" repeatCount="indefinite"/>
  </text>
  <rect x="40" y="238" width="276" height="12" rx="6" fill="#21262d"/>
  <rect x="40" y="238" width="242" height="12" rx="6" fill="url(#redGrad)">
    <animate attributeName="width" values="175;242;242;175" keyTimes="0;0.35;0.82;1" dur="4.4s" repeatCount="indefinite"/>
  </rect>

  <!-- CENTER FLOW BRIDGE -->
  <line x1="334" y1="171" x2="546" y2="171" stroke="#30363d" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="334" y1="171" x2="546" y2="171" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 18" stroke-opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.4s" repeatCount="indefinite"/>
  </line>

  <!-- Moving packet dots -->
  <circle cx="342" cy="171" r="4" fill="#79c0ff">
    <animate attributeName="cx" values="338;542" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="440" cy="171" r="3" fill="#56d364">
    <animate attributeName="cx" values="338;542" begin="0.9s" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" begin="0.9s" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Center pill -->
  <rect x="364" y="143" width="152" height="56" rx="12" fill="#0d1117" stroke="#388bfd" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
  </rect>
  <text x="440" y="167" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" font-weight="700" fill="#79c0ff">antis-optimizer</text>
  <text x="440" y="186" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="10.5" fill="#8b949e">audit · ignore · slice</text>

  <!-- Arrow tip -->
  <polygon points="538,165 547,171 538,177" fill="#56d364"/>

  <!-- RIGHT CARD: WITH -->
  <rect x="546" y="68" width="310" height="206" rx="12" fill="#161b22" stroke="#3fb950" stroke-opacity="0.55" stroke-width="1.2"/>
  <rect x="562" y="82" width="214" height="22" rx="6" fill="#0f2a1d"/>
  <text x="572" y="97" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" font-weight="700" fill="#7ee787">WITH · Clean &amp; targeted</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11.8">
    <text x="564" y="130" fill="#3fb950" font-weight="700">✓</text>
    <text x="580" y="130" fill="#e6edf3">Junk auto-blocked</text>
    <text x="838" y="130" text-anchor="end" fill="#7ee787">89% less noise</text>

    <text x="564" y="154" fill="#3fb950" font-weight="700">✓</text>
    <text x="580" y="154" fill="#e6edf3">All ignores synced</text>
    <text x="838" y="154" text-anchor="end" fill="#7ee787">1 command</text>

    <text x="564" y="178" fill="#58a6ff" font-weight="700">→</text>
    <text x="580" y="178" fill="#e6edf3">auth.ts : login()</text>
    <text x="838" y="178" text-anchor="end" fill="#79c0ff">L42-L78</text>

    <text x="564" y="202" fill="#3fb950" font-weight="700">✓</text>
    <text x="580" y="202" fill="#7ee787">Reads only those 37 lines</text>
  </g>

  <text x="562" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">Context Window</text>
  <text x="838" y="229" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" font-weight="700" fill="#7ee787">~91% Saved per read</text>
  <rect x="562" y="238" width="276" height="12" rx="6" fill="#21262d"/>
  <rect x="562" y="238" width="32" height="12" rx="6" fill="url(#greenGrad)">
    <animate attributeName="width" values="160;28;28;160" keyTimes="0;0.35;0.82;1" dur="4.4s" repeatCount="indefinite"/>
  </rect>

  <!-- FOOTER COMPATIBILITY PILLS -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">
    <rect x="24" y="292" width="106" height="28" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="77" y="310" text-anchor="middle">Claude Code</text>

    <rect x="140" y="292" width="76" height="28" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="178" y="310" text-anchor="middle">Cursor</text>

    <rect x="226" y="292" width="122" height="28" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="287" y="310" text-anchor="middle">Codex / ChatGPT</text>

    <rect x="358" y="292" width="104" height="28" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="410" y="310" text-anchor="middle">Antigravity</text>

    <rect x="472" y="292" width="214" height="28" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="579" y="310" text-anchor="middle" fill="#8b949e">TS · JS · Py · Rs · Go · C++ · HTML</text>

    <rect x="696" y="292" width="160" height="28" rx="8" fill="#0f2a1d" stroke="#238636" stroke-opacity="0.7"/>
    <text x="776" y="310" text-anchor="middle" fill="#7ee787">Zero Required Deps</text>
  </g>
</svg>
